desc: Standard M* interfaces
partcad: ">=0.8.77"  # parametric interfaces and "alias:" - see README.md

# TODO(clairbee): improve mating between various kinds of openings

# The family is declared once, parametrically, and every name this package has
# ever published is an alias of one instance of it.
#
# It used to be a Jinja2 loop writing out one interface per combination -- 25
# sizes times 20 depths times 16 widths -- which meant that a size, a depth or a
# width not in the three lists below simply did not exist. Now the lists say
# only which combinations get a *name* of their own; any other is reachable by
# asking for it:
#
#     m4-thru-3                    the published name, unchanged
#     m-thru-depth;size=4,depth=3  the same interface, asked for by value
#     m-hole;size=2.5,depth=7.5    a depth no list below has
#
# An alias is the interface it names: the same ports under the same names, a
# drop-in for it, mating with whatever it mates with. So a part that says
# "implements: m4-thru-3" and an ASSY that connects its
# "3mm-thru-opening-m4" port go on working exactly as before.

{% set sizes = [1, 1.2, 1.4, 1.6, 2, 2.5, 3, 3.5, 4, 5, 6, 8, 10, 12, 14, 16, 20, 24, 30, 32, 36, 42, 48, 56, 64] %}
{% set widths = [1, 1.5, 2, 2.5, 4, 6, 8, 10, 12, 16, 20, 24, 25, 30, 32, 40] %}
{% set depths = [1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5, 5.5, 6, 7, 8, 9, 10, 12, 14, 16, 20, 22] %}

sketches:
  m:
    desc: The boundary of an M%size% opening
    type: basic
    # A "basic" sketch has no script to hand its parameters to, so the
    # expression is how it reads them.
    circle: "%size / 2%"  # radius
    parameters:
      size:
        type: float
        default: 3.0

  m-slotted:
    desc: The boundary of an M%size% opening slotted %width%mm along X
    type: basic
    # A real slot: a rectangle with semicircular ends, two arcs and two lines.
    # "length" is measured over the ends, which is what this package's "width"
    # has always meant - "m4-thru-3-slotted-30" is 30mm end to end.
    slot:
      length: "%width%"
      width: "%size%"
    parameters:
      size:
        type: float
        default: 3.0
      width:
        type: float
        default: 10.0

  # The sketch names this package has published, each an alias of one instance
  # of the two above.
{% for size in sizes %}
  m{{ size }}: ":m;size={{ size }}"
  {% for width in widths %}
  m{{ size }}-slotted-{{ width }}: ":m-slotted;size={{ size }},width={{ width }}"
  {% endfor %}
{% endfor %}

interfaces:
  m:
    desc: Abstract %size%mm circular interface
    abstract: True
    ports:
      # The port carries the size in its name, the way it always has: the
      # M4 interface has a port called "m4".
      "m%size%":
        location: [[0, 0, 0], [0, 0, 1], 0] # redandant, for demonstration
        sketch: m
        params:
          size: "%size%"
    parameters:
      # What this interface is built from, declared the way a part declares a
      # parameter and set by a reference: "m;size=4".
      size:
        type: float
        default: 3.0
      # ... and, in the same section, what a connection made through this
      # interface may still do.
      turnZ:
        min: 0
        max: 360
        default: 0
      moveX: {}  # Hotizontal offset for openings of different sizes
      moveY: {}  # Hotizontal offset for openings of different sizes
      moveZ: {}  # Affset along the alignment axis

  m-opening:
    desc: Abstract %size%mm circular opening
    parameters:
      size: 3.0
    inherits:
      "m;size=%size%": opening
    mates:
      - "m-opening;size=%size%"

  m-hole:
    desc: "%depth%mm deep hole of %size%mm diameter"
    parameters:
      size: 3.0
      depth: 3.0
    inherits:
      "m-opening;size=%size%": "%depth%mm-hole"

  m-thru:
    desc: "%size%mm through hole"
    parameters:
      size: 3.0
    inherits:
      "m-opening;size=%size%": thru

  m-thru-depth:
    desc: "%depth%mm thick through hole of %size%mm diameter"
    parameters:
      size: 3.0
      depth: 3.0
    inherits:
      "m-thru;size=%size%": "%depth%mm"

  m-thru-slotted:
    desc: "%depth%mm thick through slotted hole %size%mm deep, %width%mm long"
    # TODO(clairbee): inherit "m-thru-depth", and give this the freedom of
    #                 movement a slot actually allows - a bolt through one may
    #                 sit anywhere along what is left of it. Both change ports
    #                 or behaviour that this package has published, so they are
    #                 a change of their own rather than a detail of this one.
    parameters:
      size: 3.0
      depth: 3.0
      width: 10.0
    ports:
      "m%size%":
        sketch: m-slotted
        params:
          size: "%size%"
          width: "%width%"

  m-threaded-thru:
    desc: "%size%mm threaded through hole"
    parameters:
      size: 3.0
    inherits:
      "m-opening;size=%size%": threaded-thru

  m-threaded-thru-depth:
    desc: "%depth%mm thick threaded through hole of %size%mm diameter"
    parameters:
      size: 3.0
      depth: 3.0
    inherits:
      "m-threaded-thru;size=%size%": "%depth%mm"

  m-threaded-hole:
    # The wording is the one this package has always used for these.
    desc: "%depth%mm thick threaded through hole of %size%mm diameter"
    parameters:
      size: 3.0
      depth: 3.0
    inherits:
      "m-hole;size=%size%,depth=%depth%": threaded

  m-shaft:
    desc: Abstract %size%mm shaft
    parameters:
      size: 3.0
    inherits:
      "m;size=%size%": shaft
    mates:
      - "m-opening;size=%size%"

  m-shaft-length:
    desc: "%length%mm long %size%mm shaft"
    parameters:
      size: 3.0
      length: 10.0
    inherits:
      "m-shaft;size=%size%": "%length%mm-long"

  m-screw:
    desc: Abstract M%size% screw
    parameters:
      size: 3.0
    inherits:
      "m;size=%size%": screw
    mates:
      - "m-opening;size=%size%"

  m-screw-length:
    desc: "%length%mm long M%size% screw"
    parameters:
      size: 3.0
      length: 6.0
      moveZ:
        max: "%length - 2%"  # TODO(clairbee): Is there an IEEE standard minimum depth?
        min: 0
        default: 0
    inherits:
      "m-screw;size=%size%": "%length%mm-long"

  # The interface names this package has published. Each is an alias of one
  # instance of the family above: the same ports under the same names, mating
  # with the same things. They are not deprecated -- a name is a contract.
{% for size in sizes %}
  m{{ size }}: "m;size={{ size }}"
  m{{ size }}-opening: "m-opening;size={{ size }}"
  {% for depth in depths %}
  m{{ size }}-hole-{{ depth }}: "m-hole;size={{ size }},depth={{ depth }}"
  {% endfor %}
  m{{ size }}-thru: "m-thru;size={{ size }}"
  {% for depth in depths %}
  m{{ size }}-thru-{{ depth }}: "m-thru-depth;size={{ size }},depth={{ depth }}"
  {% for width in widths %}
  m{{ size }}-thru-{{ depth }}-slotted-{{ width }}: "m-thru-slotted;size={{ size }},depth={{ depth }},width={{ width }}"
  {% endfor %}
  {% endfor %}
  m{{ size }}-threaded-thru: "m-threaded-thru;size={{ size }}"
  {% for depth in depths %}
  m{{ size }}-threaded-thru-{{ depth }}: "m-threaded-thru-depth;size={{ size }},depth={{ depth }}"
  {% endfor %}
  {% for depth in depths %}
  m{{ size }}-threaded-hole-{{ depth }}: "m-threaded-hole;size={{ size }},depth={{ depth }}"
  {% endfor %}
  m{{ size }}-shaft: "m-shaft;size={{ size }}"
  {% for length in depths %}
  m{{ size }}-shaft-{{ length }}: "m-shaft-length;size={{ size }},length={{ length }}"
  {% endfor %}
  m{{ size }}-screw: "m-screw;size={{ size }}"
  {% for length in depths %}
  m{{ size }}-screw-{{ length }}: "m-screw-length;size={{ size }},length={{ length }}"
  {% endfor %}
{% endfor %}
